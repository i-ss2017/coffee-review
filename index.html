<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>コーヒーレシピノート</title>
    <meta name="description" content="Android対応のコーヒー抽出レシピ記録アプリ。豆情報、注湯ステップ、エイジング経過日数、スプレッドシートインポート、★5フィルター、お気に入り機能に対応。" />
    <meta property="og:title" content="コーヒーレシピノート" />
    <meta property="og:description" content="Android対応のコーヒー抽出レシピ記録アプリ。豆情報、注湯ステップ、エイジング経過日数、スプレッドシートインポート、★5フィルター、お気に入り機能に対応。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#78350f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="珈琲ノート" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      // 過去にChromeで登録されたServiceWorkerやキャッシュを強制解除
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }).catch(function() {});
        }
      })();

      // 読込停止を防止するタイマー（もし3秒以上ローダーが残る場合はリセットボタンを表示）
      setTimeout(function() {
        var loader = document.querySelector('.initial-loader');
        var retryBtn = document.getElementById('loader-retry');
        if (loader && retryBtn) {
          retryBtn.style.display = 'inline-block';
        }
      }, 2500);

      window.addEventListener('error', function(e) {
        console.error('Window error:', e);
        var retryBtn = document.getElementById('loader-retry');
        if (retryBtn) retryBtn.style.display = 'inline-block';
      });
    </script>
  </head>
  <body class="bg-amber-50/40 text-stone-800 antialiased selection:bg-amber-200">
    <div id="root">
      <!-- 初回マウント前のローディング表示（Reactマウント時に置き換えられます） -->
      <div class="initial-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#fefce8;color:#78350f;font-family:system-ui,-apple-system,sans-serif;padding:20px;text-align:center;">
        <div style="font-size:44px;margin-bottom:12px;">☕</div>
        <div style="font-weight:700;font-size:18px;letter-spacing:0.03em;color:#451a03;margin-bottom:4px;">コーヒーレシピノート</div>
        <div style="font-size:13px;color:#92400e;margin-bottom:20px;">アプリを読み込み中...</div>
        
        <!-- 数秒待っても画面が切り替わらない場合の安全リカバリーボタン -->
        <button id="loader-retry" onclick="localStorage.clear(); sessionStorage.clear(); location.reload(true);" style="display:none;background:#d97706;color:#ffffff;border:none;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(217,119,6,0.3);">
          🔄 キャッシュをクリアして再読込
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
