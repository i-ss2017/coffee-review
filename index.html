    <script>
      (function() {
        // ゾンビServiceWorkerの自動駆除とワンタイムリロード
        var hasController = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;
        var cleanedKey = 'sw_purged_v1';

        function cleanupSW() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function() {});
          }
        }

        cleanupSW();

        // もし古いServiceWorkerがこのページを掌握(controller)していた場合、
        // unregisterしてもリロードするまでcontrollerが有効なままリクエストを破壊するため、
        // 1度だけ即座にリロードしてcontrollerの支配を完全に解除する
        if (hasController && !sessionStorage.getItem(cleanedKey)) {
          sessionStorage.setItem(cleanedKey, 'true');
          window.location.reload();
          return;
        }

        // 3.5秒経過してもReactがマウントされない場合の自動自己回復
        setTimeout(function() {
          if (!window.__APP_MOUNTED__) {
            console.warn('App mount delayed. Auto-recovering...');
            cleanupSW();
            if (!sessionStorage.getItem('app_auto_recovered')) {
              sessionStorage.setItem('app_auto_recovered', 'true');
              window.location.reload();
            }
          }
        }, 3500);
      })();
    </script>
