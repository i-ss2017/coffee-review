<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>コーヒーレシピノート</title>
    <meta name="description" content="Android対応のコーヒー抽出レシピ記録アプリ。豆情報、注湯ステップ、エイジング経過日数、スプレッドシートインポート、★5フィルター、お気に入り機能に対応。" />
    <meta property="og:title" content="コーヒーレシピノート" />
    <meta property="og:description" content="Android対応のコーヒー抽出レシピ記録アプリ。豆情報、注湯ステップ、エイジング経過日数、スプレッドシートインポート、★5フィルター、お気に入り機能に対応。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#78350f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="珈琲ノート" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      // ログ送信ヘルパー
      function reportLog(msg) {
        try {
          var img = new Image();
          img.src = '/api/client-log?msg=' + encodeURIComponent(msg) + '&t=' + Date.now();
        } catch (e) {}
      }

      reportLog('index.html script running in ' + (window.location.href));

      // 古いServiceWorkerや壊れたCacheStorageを自動で完全クリーンアップ
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            reportLog('Found ' + registrations.length + ' SW registrations, unregistering...');
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }
        }).catch(function(err) {
          reportLog('SW getRegistrations error: ' + err);
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          if (names.length > 0) {
            reportLog('Found ' + names.length + ' cache storages, deleting...');
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }
        }).catch(function() {});
      }

      // エラーを検知してサーバーログに自動記録
      window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var url = target.src || target.href || '';
          reportLog('Resource load error: <' + target.tagName + '> src=' + url);
        } else {
          var msg = event.message || (event.error && (event.error.message || event.error.stack)) || 'Unknown error';
          reportLog('Global error: ' + msg + ' at ' + (event.filename || '') + ':' + (event.lineno || ''));
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.stack || reason.message)) ? (reason.message + ' ' + reason.stack) : String(reason);
        reportLog('Unhandled rejection: ' + msg);
      });
    </script>
  </head>
  <body class="bg-amber-50/40 text-stone-800 antialiased selection:bg-amber-200">
    <div id="root">
      <!-- Reactマウント前に一瞬だけ表示される控えめなインジケーター（マウント時に自動置換） -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #78350f;">
        <div style="font-size: 40px; margin-bottom: 12px; animation: pulse 1.5s infinite ease-in-out;">☕</div>
        <div style="font-size: 14px; font-weight: 600; color: #92400e; letter-spacing: 0.05em;">コーヒーレシピノート</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
